name: Publish RFC MCP image

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-image
  queue: max

jobs:
  schedule:
    name: Check UTC build date
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.date.outputs.eligible }}
      day: ${{ steps.date.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve original run date
        id: date
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          schedule=$(python3 scripts/ghcr_image.py schedule "$GITHUB_EVENT_NAME" "$created_at")
          read -r eligible day <<< "$schedule"
          printf 'eligible=%s\nday=%s\n' "$eligible" "$day" >> "$GITHUB_OUTPUT"
          if [[ "$eligible" == false ]]; then
            echo "The $day UTC schedule is in the intervening week." >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare:
    name: Resolve pinned release and base image
    needs: schedule
    if: needs.schedule.outputs.eligible == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      source_commit: ${{ steps.image.outputs.source_commit }}
      base: ${{ steps.base.outputs.image }}
      existing_digest: ${{ steps.image.outputs.existing_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the dated tag
        id: image
        shell: bash
        env:
          BUILD_DAY: ${{ needs.schedule.outputs.day }}
        run: |
          git -C source fetch --tags origin
          release=$(python3 scripts/ghcr_image.py pinned-release)
          read -r version source_commit <<< "$release"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$version-build.$BUILD_DAY"
          digest=$(python3 scripts/ghcr_image.py image-digest \
            "$image" "$tag" "$GITHUB_SHA" "$source_commit" --allow-uninitialized)
          printf 'image=%s\ntag=%s\nsource_commit=%s\nexisting_digest=%s\n' \
            "$image" "$tag" "$source_commit" "$digest" >> "$GITHUB_OUTPUT"
          if [[ -n "$digest" ]]; then
            printf 'Reused %s:%s (%s).\n' "$image" "$tag" "$digest" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve the current Alpine index digest
        if: steps.image.outputs.existing_digest == ''
        id: base
        shell: bash
        run: |
          image=docker.io/library/alpine
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image:latest" \
            | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          printf 'image=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test Linux ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.existing_digest == ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
      ALPINE_IMAGE: ${{ needs.prepare.outputs.base }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and upload by digest
        id: build
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          docker buildx build --platform "linux/$ARCH" --pull --no-cache \
            --build-arg "ALPINE_IMAGE=$ALPINE_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "stream.publicdata.rfc-mcp.upstream-revision=$SOURCE_COMMIT" \
            --provenance=false \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            -f Dockerfile source/mcp
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/build-metadata.json")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Test the exact image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          docker pull --platform "linux/$ARCH" "$ref"
          docker run --rm "$ref" mcp-server-rfc --version
          docker run --rm --entrypoint sh "$ref" -ec '
            test "$(id -u)" -ne 0
            test -w /mirror
            command -v rsync
            printf "test RFC mirror search\n" > /mirror/rfc9110.txt
            grep -rciF --include="rfc[0-9]*.txt" -- "test RFC mirror search" /mirror
          '
          container=$(docker run -d -p 127.0.0.1::8080 "$ref")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8080/tcp)
          if ! python3 scripts/ghcr_image.py smoke-http "http://$address/mcp"; then
            docker logs "$container"
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish the tested image index
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tested-digest-*
          path: ${{ runner.temp }}/tested-digests
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish without replacing an existing date tag
        shell: bash
        run: |
          digest=$(python3 scripts/ghcr_image.py image-digest "$IMAGE" "$TAG" "$GITHUB_SHA" "$SOURCE_COMMIT")
          if [[ -n "$digest" ]]; then
            printf 'Reused %s:%s (%s).\n' "$IMAGE" "$TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          amd64=$(cat "$RUNNER_TEMP/tested-digests/amd64")
          arm64=$(cat "$RUNNER_TEMP/tested-digests/arm64")
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "$amd64" =~ $digest_pattern && "$arm64" =~ $digest_pattern ]]
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(python3 scripts/ghcr_image.py image-digest \
            "$IMAGE" "$TAG" "$GITHUB_SHA" "$SOURCE_COMMIT" --expected "$amd64" "$arm64")
          test -n "$digest"
          printf 'Published %s:%s (%s).\n' "$IMAGE" "$TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"

  update-upstream:
    name: Open a PR for a newer upstream release
    needs: schedule
    if: needs.schedule.outputs.eligible == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: true
      - name: Propose the upstream gitlink update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C source fetch --tags origin
          pin=$(git rev-parse HEAD:source)
          release=$(python3 scripts/ghcr_image.py latest-release)
          read -r version release_commit <<< "$release"
          if git -C source merge-base --is-ancestor "$release_commit" "$pin"; then
            echo "The source pin already includes upstream $version."
            exit 0
          fi
          if ! git -C source merge-base --is-ancestor "$pin" "$release_commit"; then
            echo "::error::The source pin and upstream $version have diverged."
            exit 1
          fi

          branch="automation/rfc-upstream-$version-${release_commit:0:12}"
          existing_pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f "head=$GITHUB_REPOSITORY_OWNER:$branch" -f base=main -f state=all \
            --jq '.[0].html_url // empty')
          if [[ -n "$existing_pr" ]]; then
            printf 'Upstream %s PR %s\n' "$version" "$existing_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [[ -z "$remote_branch" ]]; then
            git switch --create "$branch"
            git update-index --cacheinfo "160000,$release_commit,source"
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update RFC MCP source to $version"
            git push origin "HEAD:refs/heads/$branch"
          else
            git fetch origin "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD:source)" = "$release_commit"
            test "$(git diff-tree --no-commit-id --name-only -r FETCH_HEAD)" = source
          fi

          gh pr create --base main --head "$branch" \
            --title "Update RFC MCP source to $version" \
            --body "Update the source submodule from $pin to $release_commit for upstream release $version." \
            >> "$GITHUB_STEP_SUMMARY"
