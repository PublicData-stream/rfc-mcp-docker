name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and prefetch dependencies
        run: |
          rustup show active-toolchain
          cargo fetch --locked
      - name: Check the workspace
        run: scripts/phase0/check-rust.sh
