name: Docker Compose E2E

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      cases:
        required: true
        type: string

permissions:
  contents: read

env:
  TMPDIR: /tmp
  RFC_E2E_IMAGE_PREFIX: rfc-mcp-ci-${{ github.run_id }}-${{ inputs.arch }}
  RFC_E2E_BUNDLE_DIR: /tmp/rfc-mcp-e2e-images
  RFC_E2E_EVIDENCE_DIR: /tmp/rfc-mcp-e2e-evidence
  RFC_E2E_ARCH: ${{ inputs.arch }}
  RFC_E2E_CASES: ${{ inputs.cases }}

jobs:
  images:
    name: Build images (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build the native image bundle
        run: |
          python3 -B scripts/ci/docker-e2e.py --image-prefix "$RFC_E2E_IMAGE_PREFIX" \
            build "$RFC_E2E_BUNDLE_DIR" --arch "$RFC_E2E_ARCH" --cases "$RFC_E2E_CASES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rfc-mcp-e2e-images-${{ inputs.arch }}
          path: |
            ${{ env.RFC_E2E_BUNDLE_DIR }}/images.tar
            ${{ env.RFC_E2E_BUNDLE_DIR }}/manifest.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
          overwrite: true

  compose:
    name: ${{ matrix.phase }} (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    needs: images
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.cases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rfc-mcp-e2e-images-${{ inputs.arch }}
          path: ${{ env.RFC_E2E_BUNDLE_DIR }}
      - name: Load and verify the image bundle
        run: |
          python3 -B scripts/ci/docker-e2e.py --image-prefix "$RFC_E2E_IMAGE_PREFIX" \
            load "$RFC_E2E_BUNDLE_DIR" --arch "$RFC_E2E_ARCH" --cases "$RFC_E2E_CASES"
      - name: Provide the MCP schema validator
        if: ${{ contains(fromJSON('["phase5","phase6","phase7","phase8"]'), matrix.phase) }}
        run: |
          if ! /usr/bin/python3 -B -c 'from jsonschema import Draft202012Validator'; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y python3-jsonschema
          fi
      - name: Run the Compose probe
        env:
          RFC_E2E_PHASE: ${{ matrix.phase }}
        run: |
          /usr/bin/python3 -B scripts/ci/docker-e2e.py --image-prefix "$RFC_E2E_IMAGE_PREFIX" \
            run "$RFC_E2E_PHASE" "$RFC_E2E_EVIDENCE_DIR"
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rfc-mcp-e2e-${{ inputs.arch }}-${{ matrix.phase }}-failure-${{ github.run_attempt }}
          path: |
            ${{ env.RFC_E2E_BUNDLE_DIR }}/manifest.json
            ${{ env.RFC_E2E_EVIDENCE_DIR }}/case.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the synthetic restore report
        if: ${{ success() && matrix.phase == 'phase8' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rfc-mcp-e2e-${{ inputs.arch }}-restore-${{ github.run_attempt }}
          path: ${{ env.RFC_E2E_EVIDENCE_DIR }}/restore.json
          if-no-files-found: error
          retention-days: 7
