[package]
name = "rfc-mcp-docker-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rfc-mcp-docker-sync"
path = "src/main.rs"

[dependencies]
rfc-core = { path = "../core" }
rfc-mcp-docker = { path = "../../apps" }
rfc-storage = { path = "../storage" }
tokio-postgres.workspace = true
reqwest.workspace = true
httpdate = "1"
serde.workspace = true
serde_json.workspace = true
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "signal", "sync"] }
tempfile = { version = "3", optional = true }
libc.workspace = true
roxmltree = "0.21"

[features]
phase1-fixtures = []
phase2-fixtures = ["dep:tempfile"]
phase3-fixtures = ["phase2-fixtures", "rfc-storage/phase3-fixtures"]
phase6-fixtures = ["phase3-fixtures"]

[[bin]]
name = "rfc-phase1-fixture"
path = "src/bin/phase1-fixture.rs"
required-features = ["phase1-fixtures"]

[[bin]]
name = "rfc-phase2-fixture"
path = "src/bin/phase2-fixture.rs"
required-features = ["phase2-fixtures"]

[[bin]]
name = "rfc-phase3-fixture"
path = "src/bin/phase3-fixture.rs"
required-features = ["phase3-fixtures"]
