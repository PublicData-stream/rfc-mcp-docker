services:
  serve:
    volumes:
      - ${PHASE2_DRIVER}:/phase2/fixture-driver:ro
  sync:
    tmpfs: !override
      - /tmp:size=144m,mode=1777,noexec,nosuid,nodev
    networks:
      fixture_source: {}
    volumes:
      - ${PHASE2_DRIVER}:/phase2/fixture-driver:ro
      - ${PHASE1_DIR}/certs/ca.crt:/phase2/ca.crt:ro
  fixtures:
    image: ${PHASE1_IMAGE_PREFIX}-fixtures
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    networks: [fixture_source]
    volumes:
      - ${PHASE2_SOURCE}:/fixture-source:ro
      - ${PHASE2_ENDPOINT}:/fixture-endpoint.py:ro
    entrypoint: [python3, /fixture-endpoint.py]
    healthcheck:
      test: [CMD, python3, -c, 'import socket; socket.create_connection(("127.0.0.1", 8443), 1).close()']
      interval: 1s
      timeout: 2s
      retries: 20

networks:
  fixture_source: {internal: true}
