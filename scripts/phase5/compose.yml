services:
  serve:
    image: ${PHASE5_SERVE_IMAGE:-${PHASE1_IMAGE_PREFIX}-serve}
    stop_grace_period: 25s
    environment:
      RFC_DB_PORT: ${PHASE5_DB_PORT:-5432}
      RFC_MCP_DB_POOL_MIN_IDLE: ${PHASE5_POOL_MIN_IDLE:-2}
      RFC_MCP_DB_POOL_MAX_CONNECTIONS: ${PHASE5_POOL_MAX_CONNECTIONS:-8}
      RFC_MCP_DB_POOL_IDLE_TIMEOUT_SECONDS: ${PHASE5_POOL_IDLE_TIMEOUT_SECONDS:-300}
      RFC_MCP_DB_POOL_MAX_LIFETIME_SECONDS: ${PHASE5_POOL_MAX_LIFETIME_SECONDS:-1800}
      RFC_MCP_BIND: 0.0.0.0:8780
      RFC_MCP_HOSTS: rfc.test
      RFC_MCP_ORIGINS: https://rfc.test
      RFC_MCP_TRUSTED_PROXIES: ${PHASE5_PROXY_IP:-}
      RFC_MCP_CLIENT_IP_HEADER: ${PHASE5_CLIENT_IP_HEADER:-X-Real-IP}
      RFC_MCP_CLIENT_IP_HEADER_MODE: ${PHASE5_CLIENT_IP_HEADER_MODE:-single}
    volumes:
      - ${PHASE5_DIR}/cursor-key:/run/secrets/rfc_cursor_key:ro
    networks:
      phase5_ingress: {}
  sync:
    volumes:
      - ${PHASE5_DIR}/fixture-policy.json:/phase5/fixture-policy.json:ro
  proxy:
    image: ${PHASE1_IMAGE_PREFIX}-fixtures
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    entrypoint: [python3, -B, /phase5/proxy.py]
    volumes:
      - ${PHASE5_SCRIPTS}:/phase5:ro
      - ${PHASE5_DIR}/tls:/tls:ro
    networks: [phase5_ingress, phase5_edge]
    ports:
      - target: 8443
        host_ip: 127.0.0.1

networks:
  phase5_ingress: {internal: true}
  phase5_edge: {}
