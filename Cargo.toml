[workspace]
members = ["apps", "crates/core", "crates/test-support"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
blake3 = "1"
libc = "0.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
