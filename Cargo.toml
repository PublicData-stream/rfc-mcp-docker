[workspace]
members = ["apps", "crates/core", "crates/search", "crates/test-support", "crates/storage", "crates/sync"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
blake3 = "1"
libc = "0.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
