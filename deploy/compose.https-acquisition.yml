# HTTPS-first qualification and shadow operation. Provision both private volumes first.
services:
  rfc-mcp-docker-sync:
    volumes:
      - type: bind
        source: ${RFC_SYNC_SPOOL_HOST_DIR:?Provision a private disk-backed HTTPS spool}
        target: /rfc-https-spool
        bind:
          create_host_path: false
      - type: bind
        source: ${RFC_SYNC_AUDIT_HOST_DIR:?Provision a private disk-backed rsync audit volume}
        target: /rfc-rsync-audit
        bind:
          create_host_path: false
  rfc-mcp-docker-feed:
    networks: !override
      feed_control: {}
